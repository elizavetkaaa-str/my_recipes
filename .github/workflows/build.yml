name: Build Windows exe
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install PyQt6 pyinstaller

      - name: Unpack Images
        run: Expand-Archive Images.zip -DestinationPath .

      - name: Build
        run: pyinstaller --onefile --windowed --name "Мои рецепты" Lisss_Code.py

      - name: Add data files
        run: |
          Copy-Item My_Recipes.db dist/
          Copy-Item Images dist/ -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist
